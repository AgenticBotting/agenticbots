# AgenticBots client runtime — one per client, on that client's own EC2.
#
#   hermes       the pinned engine (multi-profile gateway: one Bot = one profile)
#   cloudflared  outbound-only tunnel; the ONLY way the platform reaches the engine
#
# Nothing is published on the host: no ports: entries at all. The engine API
# (8642) is reachable only on the private compose network, by cloudflared.
# The engine dashboard is not run.
#
# ENGINE_IMAGE must be pinned by digest (…@sha256:…) — see
# docs/research/HERMES_INTEGRATION.md. lifecycle.sh refuses floating tags.
# The tunnel image is pinned by digest too.

name: agenticbots

services:
  hermes:
    image: ${ENGINE_IMAGE:?ENGINE_IMAGE must be set (pinned by digest)}
    container_name: agb-hermes
    # The pinned upstream s6 bootstrap requires root, then drops service
    # processes to UID 10000. Do not force --user and break that bootstrap.
    # A fully read-only/custom non-root image remains a staging release gate.
    restart: unless-stopped
    command: ["gateway", "run"]
    env_file:
      - /opt/agenticbots/secrets/engine.env   # written by lifecycle.sh from Secrets Manager; mode 600
    environment:
      HERMES_UID: "10000"
      HERMES_GID: "10000"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"     # private compose network only — no host port is published
      API_SERVER_PORT: "8642"
    volumes:
      # The single source of truth for all engine state (config, profiles,
      # sessions, memory, skills, scheduled jobs). Lives on the encrypted EBS
      # data volume, so it survives container/instance restarts, suspension
      # and upgrades.
      - ${AGB_DATA_DIR:-/opt/agenticbots/data}/engine:/opt/data
    networks: [runtime]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.75"
          memory: 3200M
          pids: 256
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, KILL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  cloudflared:
    image: ${TUNNEL_IMAGE:-cloudflare/cloudflared:2025.9.1@sha256:4604b477520dc8322af5427da68b44f0bf814938e9d2e4814f2249ee4b03ffdf}
    container_name: agb-tunnel
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file:
      - /opt/agenticbots/secrets/tunnel.env   # TUNNEL_TOKEN=…
    networks: [runtime]
    depends_on:
      hermes:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  runtime:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: agb-runtime
