# Engine configuration for the runtime's DEFAULT profile (the host gateway).
# lifecycle.sh merges this into <data>/engine/config.yaml on every start.
# The default profile runs no AgenticBots work itself; it hosts the API
# listener that serves every Bot profile under /p/<profile>/.

gateway:
  # One listener for every Bot profile, each behind its own key. Explicit,
  # so the gateway never falls back to serving the default profile only.
  multiplex_profiles: true
  api_server:
    max_concurrent_runs: 4

# Fail closed on both unattended surfaces. An explicit empty list means zero
# model-callable tools in Hermes; omitting the key would inherit the engine's
# defaults. AgenticBots enables reviewed tools later with a per-BOT overlay.
platform_toolsets:
  api_server: []
  cron: []

agent:
  # Bot Mode is a Desktop orchestration plugin. Keep its prompt protocol and
  # dynamically injected message_agent tool off on the headless host profile.
  bot_mode_protocol: false
  # Bound every model turn and provider failure path. These are containment
  # limits, not the platform's still-required prepaid cost reservation.
  max_turns: 25
  budget_warning_ratio: 0.8
  run_budget_seconds: 600
  api_max_retries: 1
  auto_recovery_cycles: 0
  disabled_toolsets:
    - terminal
    - code_execution

cron:
  # Schedules are created by AgenticBots. A BOT may not create more schedules
  # for itself and grow an unreviewed execution loop.
  allow_agent_scheduling: false

approvals:
  mode: manual
  unattended_mode: deny
  cron_mode: deny
  timeout: 300
