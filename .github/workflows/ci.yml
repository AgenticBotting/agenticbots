# CI. Every gate here also runs locally:
#   npm run lint · npm run typecheck · npm test · npm run build · npm run test:white-label
#   npm run test:e2e · terraform validate · docker compose config
name: ci
on:
  push: {}
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dependency security gate
        run: node scripts/security-dependency-audit.mjs
      - name: Tracked source secret scan
        run: node scripts/security-source-scan.mjs
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, integration, security and white-label tests (demo mode, no external services)
        run: npm test
      - name: Dataset validation
        run: node scripts/validate-cities.mjs
      - name: pSEO uniqueness gate
        run: node scripts/pseo-gate.mjs
      - name: Build (runs prebuild gate again)
        run: npm run build
      - name: White-label scan of browser bundles
        run: node scripts/white-label-scan.mjs
      - name: SEO gates — title/meta uniqueness, one H1, canonical
        run: node scripts/seo-checks.mjs
      - name: Link & data integrity — sitemap, hrefs, enriched⟕dataset
        run: node scripts/link-integrity.mjs

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: "true" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: terraform fmt
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: terraform validate
        run: |
          cd infra/terraform/envs/prod
          terraform init -backend=false -input=false
          terraform validate
      - name: Runtime compose config
        run: |
          mkdir -p /opt/agenticbots/secrets 2>/dev/null || sudo mkdir -p /opt/agenticbots/secrets
          sudo touch /opt/agenticbots/secrets/engine.env /opt/agenticbots/secrets/tunnel.env
          ENGINE_IMAGE="nousresearch/hermes-agent:v2026.9.24@sha256:$(printf '0%.0s' {1..64})" docker compose -f infra/runtime/docker-compose.yml config --quiet
      - name: Lifecycle script syntax
        run: bash -n infra/runtime/lifecycle.sh infra/runtime/network-guard.sh

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Secret and infrastructure scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: node_modules,.next,.git,docs/security-audit-2026-10-09

  codeql:
    # Private repository code scanning requires the owner's GitHub entitlement.
    if: vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
